<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OpenDraft CAD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand"><span class="logo">OD</span><span>OpenDraft&nbsp;CAD</span></div>
    <div class="qat">
      <button data-cmd="NEW" title="New (Ctrl+N)" data-icon="new"></button>
      <button data-cmd="OPEN" title="Open .json / .dxf (Ctrl+O)" data-icon="open"></button>
      <button data-cmd="SAVE" title="Save (Ctrl+S)" data-icon="save"></button>
      <button data-cmd="DXFOUT" title="Export DXF" data-icon="export"></button>
      <span class="sep"></span>
      <button data-cmd="UNDO" title="Undo (Ctrl+Z)" data-icon="undo"></button>
      <button data-cmd="REDO" title="Redo (Ctrl+Y)" data-icon="redo"></button>
    </div>
    <div id="doctitle">Drawing1</div>
    <div class="right"><button id="helpBtn" data-cmd="HELP" title="Help (F1)">?</button></div>
  </header>

  <nav id="ribbon">
    <div class="tabs" id="ribbonTabs"></div>
    <div class="panels" id="ribbonPanels"></div>
  </nav>

  <main id="main">
    <div id="viewport">
      <canvas id="cad"></canvas>
      <div id="dyn" hidden></div>
      <div id="navbar">
        <button data-cmd="ZOOM_EXT" title="Zoom extents (double-click wheel)" data-icon="zoomext"></button>
        <button data-cmd="ZOOM_IN" title="Zoom in" data-icon="zoomin"></button>
        <button data-cmd="ZOOM_OUT" title="Zoom out" data-icon="zoomout"></button>
        <button data-cmd="PAN" title="Pan (middle mouse / space+drag)" data-icon="pan"></button>
      </div>
      <div id="tabsbar"><span class="mtab active">Model</span></div>
    </div>
    <aside id="side">
      <section class="pal" id="palProps">
        <h3><span>Properties</span><button class="collapse" data-target="propsBody">–</button></h3>
        <div class="body" id="propsBody"></div>
      </section>
      <section class="pal" id="palLayers">
        <h3><span>Layers</span><button class="collapse" data-target="layersBody">–</button></h3>
        <div class="body" id="layersBody"></div>
      </section>
    </aside>
  </main>

  <div id="cmdline">
    <div id="history"></div>
    <div id="suggest" hidden></div>
    <div id="cmdrow">
      <span class="chev">&gt;_</span>
      <span id="prompt">Type a command</span>
      <input id="cmdinput" autocomplete="off" spellcheck="false" autocapitalize="off">
    </div>
  </div>

  <footer id="status">
    <span id="coords">0.0000, 0.0000</span>
    <span class="model">MODEL</span>
    <div class="toggles">
      <button data-mode="grid" title="Grid display (F7)">GRID</button>
      <button data-mode="snap" title="Snap mode (F9)">SNAP</button>
      <button data-mode="ortho" title="Ortho mode (F8)">ORTHO</button>
      <button data-mode="polar" title="Polar tracking (F10)">POLAR</button>
      <button data-mode="osnap" title="Object snap (F3)">OSNAP</button>
      <button id="osnapMenuBtn" title="Object snap settings">▾</button>
      <button data-mode="dyn" title="Dynamic input (F12)">DYN</button>
    </div>
    <span id="selinfo"></span>
  </footer>

  <div id="osnapMenu" hidden></div>
</div>

<div id="helpModal" class="modal" hidden>
  <div class="dialog">
    <div class="dhead"><b>OpenDraft CAD — Commands &amp; Shortcuts</b><button id="helpClose">✕</button></div>
    <div class="dbody" id="helpBody"></div>
  </div>
</div>

<script src="js/geom.js"></script>
<script src="js/entities.js"></script>
<script src="js/app.js"></script>
<script src="js/commands.js"></script>
<script src="js/io.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
