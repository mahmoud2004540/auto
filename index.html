<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OpenDraft CAD</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand"><span class="logo" title="Application menu">OD<i>&#9662;</i></span></div>
    <div class="qat">
      <button data-cmd="NEW" title="New (Ctrl+N)" data-icon="new"></button>
      <button data-cmd="OPEN" title="Open .json / .dxf (Ctrl+O)" data-icon="open"></button>
      <button data-cmd="SAVE" title="Save (Ctrl+S)" data-icon="save"></button>
      <button data-cmd="DXFOUT" title="Export DXF" data-icon="export"></button>
      <span class="sep"></span>
      <button data-cmd="UNDO" title="Undo (Ctrl+Z)" data-icon="undo"></button>
      <button data-cmd="REDO" title="Redo (Ctrl+Y)" data-icon="redo"></button>
    </div>
    <div id="doctitle">Drawing1</div>
    <div class="right"><input id="search" placeholder="Type a keyword or phrase" autocomplete="off" spellcheck="false"><button id="helpBtn" data-cmd="HELP" title="Help (F1)">?</button></div>
  </header>

  <nav id="ribbon">
    <div class="tabs" id="ribbonTabs"></div>
    <div class="panels" id="ribbonPanels"></div>
  </nav>

  <div id="filetabs">
    <button id="appMenuBtn" title="Menu" data-cmd="HELP">&#9776;</button>
    <span class="ftab" data-cmd="HELP">Start</span>
    <span class="ftab active"><b id="ftabName">Drawing1</b><button data-cmd="NEW" title="Close / new drawing">&#10005;</button></span>
    <button class="ftabadd" data-cmd="NEW" title="New drawing">+</button>
  </div>

  <main id="main">
    <div id="viewport">
      <canvas id="cad"></canvas>
      <div id="dyn" hidden></div>
      <div id="navbar">
        <button data-cmd="ZOOM_EXT" title="Zoom extents (double-click wheel)" data-icon="zoomext"></button>
        <button data-cmd="ZOOM" title="Zoom window" data-icon="zoomwin"></button>
        <button data-cmd="ZOOM_IN" title="Zoom in" data-icon="zoomin"></button>
        <button data-cmd="ZOOM_OUT" title="Zoom out" data-icon="zoomout"></button>
        <button data-cmd="PAN" title="Pan (middle mouse / space+drag)" data-icon="pan"></button>
      </div>
      <div id="vplabel">[-][<span data-cmd="ZOOM_EXT">Top</span>][2D Wireframe]</div>
      <div id="compass" title="Click TOP to zoom extents">
        <span class="n">N</span><span class="s">S</span><span class="w">W</span><span class="e">E</span>
        <div class="ring"></div><button class="top" data-cmd="ZOOM_EXT">TOP</button>
        <div class="wcs">WCS</div>
      </div>
      <div id="cmdline">
        <div id="history"></div>
        <div id="suggest" hidden></div>
        <div id="cmdrow">
          <button class="clbtn" data-cmd="CANCEL" title="Cancel (Esc)">&#10005;</button>
          <button class="clbtn" id="clHist" title="Command history (F2)" data-icon="wrench"></button>
          <button class="clbtn" id="clRecent" title="Recent commands">&#9652;</button>
          <span class="chev">&gt;_</span>
          <span id="prompt">Type a command</span>
          <input id="cmdinput" autocomplete="off" spellcheck="false" autocapitalize="off">
        </div>
      </div>
    </div>
    <aside id="side" hidden>
      <section class="pal" id="palProps">
        <h3><span>Properties</span><button class="collapse" data-target="propsBody">–</button></h3>
        <div class="body" id="propsBody"></div>
      </section>
      <section class="pal" id="palLayers">
        <h3><span>Layers</span><button class="collapse" data-target="layersBody">–</button></h3>
        <div class="body" id="layersBody"></div>
      </section>
    </aside>
  </main>

  <footer id="status">
    <div class="ltabs">
      <button class="lt active" data-layout="Model">Model</button>
      <button class="lt" data-layout="Layout1">Layout1</button>
      <button class="lt" data-layout="Layout2">Layout2</button>
      <button class="lt" data-layout="+">+</button>
    </div>
    <span id="selinfo"></span>
    <span id="coords">0.0000, 0.0000</span>
    <span class="model">MODEL</span>
    <div class="toggles">
      <button data-mode="grid" title="Display drawing grid (F7)" data-icon="st_grid"></button>
      <button data-mode="snap" title="Snap mode (F9)" data-icon="st_snap"></button>
      <button data-mode="dyn" title="Dynamic input (F12)" data-icon="st_dyn"></button>
      <button data-mode="ortho" title="Ortho mode (F8)" data-icon="st_ortho"></button>
      <button data-mode="polar" title="Polar tracking (F10)" data-icon="st_polar"></button>
      <button data-mode="osnap" title="Object snap (F3)" data-icon="st_osnap"></button>
      <button id="osnapMenuBtn" title="Object snap settings">&#9662;</button>
      <button data-mode="lwt" title="Show/hide lineweight" data-icon="st_lwt"></button>
      <button data-cmd="TOGGLE_SIDE" title="Properties &amp; Layers palettes" data-icon="st_props"></button>
    </div>
  </footer>

  <div id="osnapMenu" hidden></div>
</div>

<div id="helpModal" class="modal" hidden>
  <div class="dialog">
    <div class="dhead"><b>OpenDraft CAD — Commands &amp; Shortcuts</b><button id="helpClose">✕</button></div>
    <div class="dbody" id="helpBody"></div>
  </div>
</div>

<script src="js/geom.js"></script>
<script src="js/entities.js"></script>
<script src="js/hatch.js"></script>
<script src="js/app.js"></script>
<script src="js/commands.js"></script>
<script src="js/blocks.js"></script>
<script src="js/io.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
